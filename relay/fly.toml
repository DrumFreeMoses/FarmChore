# fly.toml app configuration file generated for farmchore on 2026-08-05T15:20:57-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'farmchore'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADDR = ':8080'
  DATABASE_PATH = '/data/farmchore.db'
  WEB_DIR = '/web'

[[mounts]]
  source = 'data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 100

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
